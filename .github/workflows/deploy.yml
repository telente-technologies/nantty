name: Deploy

on:
  push:
    branches: [main]
    paths: ["services/**", "packages/**", "infra/aws/tls-proxy/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", ".github/workflows/deploy.yml", ".github/scripts/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: tls-proxy, context: infra/aws/tls-proxy, file: infra/aws/tls-proxy/Dockerfile }
          - { service: go-identity, context: services, file: services/go/deployables/goIdentity/Dockerfile }
          - { service: go-commerce, context: services, file: services/go/deployables/goCommerce/Dockerfile }
          - { service: go-money, context: services, file: services/go/deployables/goMoney/Dockerfile }
          - { service: go-live, context: services, file: services/go/deployables/goLive/Dockerfile }
          - { service: go-ads, context: services, file: services/go/deployables/goAds/Dockerfile }
          - { service: go-trust, context: services, file: services/go/deployables/goTrust/Dockerfile }
          - { service: gateway, context: ., file: services/typescript/gateway/Dockerfile }
          - { service: social, context: ., file: services/typescript/social/Dockerfile }
          - { service: notifications, context: ., file: services/typescript/notifications/Dockerfile }
          - { service: media, context: ., file: services/typescript/media/Dockerfile }
          - { service: search, context: ., file: services/typescript/search/Dockerfile }
          - { service: support, context: ., file: services/typescript/support/Dockerfile }
          - { service: realtime, context: services/elixir/realtime, file: services/elixir/realtime/Dockerfile }
          - { service: intelligence, context: services/python/intelligence, file: services/python/intelligence/Dockerfile }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          load: true
          tags: scan/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          # TypeScript 7's native tsc arrives only as Prisma's optional peer and never runs in the services.
          skip-files: "**/@typescript/typescript-linux-*/lib/tsc"
          ignore-unfixed: true
          exit-code: "1"
      - uses: aws-actions/configure-aws-credentials@v6
        if: vars.AWS_ACCOUNT_ID_STAGING != ''
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_STAGING }}:role/nantty-staging-github-ecr-push
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        if: vars.AWS_ACCOUNT_ID_STAGING != ''
      - name: Push to ECR
        uses: docker/build-push-action@v7
        if: vars.AWS_ACCOUNT_ID_STAGING != ''
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/arm64
          provenance: mode=max
          sbom: true
          tags: ${{ steps.ecr.outputs.registry }}/nantty/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}

  deploy-staging:
    needs: build
    if: vars.AWS_ACCOUNT_ID_STAGING != ''
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_STAGING }}:role/nantty-staging-github-deploy
          aws-region: ${{ vars.AWS_REGION }}
      - name: Create and verify pre-migration Aurora snapshot
        env:
          AURORA_CLUSTER_ID: ${{ vars.AURORA_CLUSTER_ID_STAGING }}
          RESTORE_JOB_ID: ${{ vars.MIGRATION_RESTORE_JOB_ID_STAGING }}
          MIGRATE_TASK_DEFINITION: ${{ vars.MIGRATE_TASK_DEFINITION }}
        run: bash .github/scripts/migrationSnapshotGate.sh staging
      - name: Run pre-deploy migration task
        env:
          MIGRATE_TASK_DEFINITION: ${{ vars.MIGRATE_TASK_DEFINITION }}
          MIGRATION_IMAGE: "${{ vars.AWS_ACCOUNT_ID_STAGING }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/nantty/go-money:${{ github.sha }}"
          PRIVATE_SUBNETS: ${{ vars.STAGING_PRIVATE_SUBNETS }}
          TASKS_SECURITY_GROUP: ${{ vars.STAGING_TASKS_SECURITY_GROUP }}
        run: bash .github/scripts/runMigrationTask.sh staging
      - id: registry
        run: echo "host=${{ vars.AWS_ACCOUNT_ID_STAGING }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"
      - name: Roll out services (ECS rolling with rollback)
        env:
          REGISTRY: ${{ steps.registry.outputs.host }}
        run: |
          for service in go-identity go-commerce go-live go-ads go-trust social notifications media search support realtime intelligence gateway; do
            bash .github/scripts/deployService.sh "$service" "$REGISTRY/nantty/$service:$IMAGE_TAG" staging &
            pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          [ "$failed" = 0 ]
          bash .github/scripts/deployService.sh go-money "$REGISTRY/nantty/go-money:$IMAGE_TAG" staging

  smoke-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash .github/scripts/smokeTest.sh "${{ vars.STAGING_API_URL }}"

  deploy-production:
    needs: smoke-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_PROD }}:role/nantty-prod-github-deploy
          aws-region: ${{ vars.AWS_REGION }}
      - name: Create and verify pre-migration Aurora snapshot
        env:
          AURORA_CLUSTER_ID: ${{ vars.AURORA_CLUSTER_ID_PROD }}
          RESTORE_JOB_ID: ${{ vars.MIGRATION_RESTORE_JOB_ID_PROD }}
          MIGRATE_TASK_DEFINITION: ${{ vars.MIGRATE_TASK_DEFINITION_PROD }}
        run: bash .github/scripts/migrationSnapshotGate.sh prod
      - id: registries
        run: |
          staging="${{ vars.AWS_ACCOUNT_ID_STAGING }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          prod="${{ vars.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$prod"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$staging"
          echo "staging=$staging" >> "$GITHUB_OUTPUT"
          echo "prod=$prod" >> "$GITHUB_OUTPUT"
      - name: Promote the exact staging images to the production registry
        run: |
          for service in tls-proxy go-identity go-commerce go-money go-live go-ads go-trust social notifications media search support realtime intelligence gateway; do
            docker buildx imagetools create --tag "${{ steps.registries.outputs.prod }}/nantty/$service:$IMAGE_TAG" "${{ steps.registries.outputs.staging }}/nantty/$service:$IMAGE_TAG"
          done
      - name: Run pre-deploy migration task
        env:
          MIGRATE_TASK_DEFINITION: ${{ vars.MIGRATE_TASK_DEFINITION_PROD }}
          MIGRATION_IMAGE: "${{ vars.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/nantty/go-money:${{ github.sha }}"
          PRIVATE_SUBNETS: ${{ vars.PROD_PRIVATE_SUBNETS }}
          TASKS_SECURITY_GROUP: ${{ vars.PROD_TASKS_SECURITY_GROUP }}
        run: bash .github/scripts/runMigrationTask.sh prod
      - name: Roll out services
        env:
          REGISTRY: ${{ steps.registries.outputs.prod }}
        run: |
          for service in go-identity go-commerce go-live go-ads go-trust social notifications media search support realtime intelligence gateway; do
            bash .github/scripts/deployService.sh "$service" "$REGISTRY/nantty/$service:$IMAGE_TAG" prod &
            pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          [ "$failed" = 0 ]
          bash .github/scripts/deployService.sh go-money "$REGISTRY/nantty/go-money:$IMAGE_TAG" prod
      - run: bash .github/scripts/smokeTest.sh "${{ vars.PROD_API_URL }}"
