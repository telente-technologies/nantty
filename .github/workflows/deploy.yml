name: Deploy

on:
  push:
    branches: [main]
    paths: ["services/**", "apps/api/**", "apps/intelligence/**", "pnpm-lock.yaml", ".github/workflows/deploy.yml", ".github/scripts/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: go-identity, context: services, file: services/go/deployables/goIdentity/Dockerfile }
          - { service: go-commerce, context: services, file: services/go/deployables/goCommerce/Dockerfile }
          - { service: go-money, context: services, file: services/go/deployables/goMoney/Dockerfile }
          - { service: go-live, context: services, file: services/go/deployables/goLive/Dockerfile }
          - { service: go-ads, context: services, file: services/go/deployables/goAds/Dockerfile }
          - { service: go-trust, context: services, file: services/go/deployables/goTrust/Dockerfile }
          - { service: gateway, context: ., file: services/typescript/gateway/Dockerfile }
          - { service: social, context: ., file: services/typescript/social/Dockerfile }
          - { service: notifications, context: ., file: services/typescript/notifications/Dockerfile }
          - { service: media, context: ., file: services/typescript/media/Dockerfile }
          - { service: realtime, context: services/elixir/realtime, file: services/elixir/realtime/Dockerfile }
          - { service: intelligence, context: apps/intelligence, file: apps/intelligence/Dockerfile }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v3
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: scan/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: scan/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_STAGING }}:role/zudomart-staging-github-ecr-push
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push to ECR
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.ecr.outputs.registry }}/zudomart/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_STAGING }}:role/zudomart-staging-github-deploy
          aws-region: ${{ vars.AWS_REGION }}
      - name: Run pre-deploy migration task
        if: ${{ vars.MIGRATE_TASK_DEFINITION != '' }}
        run: |
          aws ecs run-task --cluster zudomart-staging --task-definition "${{ vars.MIGRATE_TASK_DEFINITION }}" \
            --launch-type FARGATE --started-by "ci-${{ github.sha }}" \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.STAGING_PRIVATE_SUBNETS }}],securityGroups=[${{ vars.STAGING_TASKS_SECURITY_GROUP }}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text > task.txt
          aws ecs wait tasks-stopped --cluster zudomart-staging --tasks "$(cat task.txt)"
          test "$(aws ecs describe-tasks --cluster zudomart-staging --tasks "$(cat task.txt)" --query 'tasks[0].containers[0].exitCode' --output text)" = 0
      - id: registry
        run: echo "host=${{ vars.AWS_ACCOUNT_ID_STAGING }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"
      - name: Roll out services (ECS rolling, CodeDeploy blue/green for go-money)
        env:
          REGISTRY: ${{ steps.registry.outputs.host }}
        run: |
          for service in go-identity go-commerce go-live go-ads go-trust social notifications media realtime intelligence gateway; do
            bash .github/scripts/deployService.sh "$service" "$REGISTRY/zudomart/$service:$IMAGE_TAG" staging &
            pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          [ "$failed" = 0 ]
          bash .github/scripts/deployService.sh go-money "$REGISTRY/zudomart/go-money:$IMAGE_TAG" staging true 8080

  smoke-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash .github/scripts/smokeTest.sh "${{ vars.STAGING_API_URL }}"

  deploy-production:
    needs: smoke-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_PROD }}:role/zudomart-prod-github-deploy
          aws-region: ${{ vars.AWS_REGION }}
      - id: registries
        run: |
          staging="${{ vars.AWS_ACCOUNT_ID_STAGING }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          prod="${{ vars.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$prod"
          aws ecr get-login-password --registry-ids "${{ vars.AWS_ACCOUNT_ID_STAGING }}" | docker login --username AWS --password-stdin "$staging"
          echo "staging=$staging" >> "$GITHUB_OUTPUT"
          echo "prod=$prod" >> "$GITHUB_OUTPUT"
      - name: Promote the exact staging images to the production registry
        run: |
          for service in go-identity go-commerce go-money go-live go-ads go-trust social notifications media realtime intelligence gateway; do
            docker buildx imagetools create --tag "${{ steps.registries.outputs.prod }}/zudomart/$service:$IMAGE_TAG" "${{ steps.registries.outputs.staging }}/zudomart/$service:$IMAGE_TAG"
          done
      - name: Run pre-deploy migration task
        if: ${{ vars.MIGRATE_TASK_DEFINITION_PROD != '' }}
        run: |
          aws ecs run-task --cluster zudomart-prod --task-definition "${{ vars.MIGRATE_TASK_DEFINITION_PROD }}" \
            --launch-type FARGATE --started-by "ci-${{ github.sha }}" \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.PROD_PRIVATE_SUBNETS }}],securityGroups=[${{ vars.PROD_TASKS_SECURITY_GROUP }}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text > task.txt
          aws ecs wait tasks-stopped --cluster zudomart-prod --tasks "$(cat task.txt)"
          test "$(aws ecs describe-tasks --cluster zudomart-prod --tasks "$(cat task.txt)" --query 'tasks[0].containers[0].exitCode' --output text)" = 0
      - name: Roll out services
        env:
          REGISTRY: ${{ steps.registries.outputs.prod }}
        run: |
          for service in go-identity go-commerce go-live go-ads go-trust social notifications media realtime intelligence gateway; do
            bash .github/scripts/deployService.sh "$service" "$REGISTRY/zudomart/$service:$IMAGE_TAG" prod &
            pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          [ "$failed" = 0 ]
          bash .github/scripts/deployService.sh go-money "$REGISTRY/zudomart/go-money:$IMAGE_TAG" prod true 8080
      - run: bash .github/scripts/smokeTest.sh "${{ vars.PROD_API_URL }}"
