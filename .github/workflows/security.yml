name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml --baseline-path .gitleaks-baseline.json --exit-code 1 .'

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm audit --prod --audit-level=high
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/go/platform/go.mod
          cache-dependency-path: services/go/**/go.sum
      - name: govulncheck (per module; it needs a go.mod in the working directory)
        run: |
          status=0
          for dir in $(go list -m -f '{{.Dir}}'); do
            (cd "$dir" && go run golang.org/x/vuln/cmd/govulncheck@latest ./...) || status=1
          done
          exit $status
        working-directory: services/go
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv export --frozen --no-dev --no-emit-project -o /tmp/requirements.txt && uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip
        working-directory: services/python/intelligence
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.5"
          otp-version: "29"
      - run: |
          set -o pipefail
          mix local.hex --force --if-missing
          mix local.rebar --force --if-missing
          mix deps.get
          mix hex.audit 2>&1 | tee /tmp/hex-audit.log || {
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done < /tmp/hex-audit.log
            exit 1
          }
        working-directory: services/elixir/realtime

  trivy-filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: /tmp/trivy-results.json
          exit-code: "0"
      - run: |
          python3 - <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path("/tmp/trivy-results.json").read_text())
          seen = set()
          for result in data.get("Results", []):
              target = result.get("Target", "")
              for vuln in result.get("Vulnerabilities", []):
                  key = ("VULN", vuln.get("Severity"), vuln.get("VulnerabilityID"), vuln.get("PkgName"), vuln.get("FixedVersion"))
                  if key not in seen:
                      seen.add(key)
                      print(f"::error::{target}: [{vuln.get('Severity')}] {vuln.get('VulnerabilityID')} {vuln.get('PkgName')}@{vuln.get('InstalledVersion')} -> fixed {vuln.get('FixedVersion')}")
              for mis in result.get("Misconfigurations", []):
                  key = ("MIS", mis.get("Severity"), mis.get("ID"), target)
                  if key not in seen:
                      seen.add(key)
                      print(f"::error::{target}: [{mis.get('Severity')}] {mis.get('ID')} {mis.get('Title')}")
              for sec in result.get("Secrets", []):
                  key = ("SEC", sec.get("Severity"), sec.get("RuleID"), target, sec.get("StartLine"))
                  if key not in seen:
                      seen.add(key)
                      print(f"::error::{target}: [{sec.get('Severity')}] {sec.get('RuleID')} {sec.get('Title')} line {sec.get('StartLine')}")
          sys.exit(1 if seen else 0)
          PY

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive infra/aws
      - working-directory: infra/aws/envs/${{ matrix.environment }}
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/aws
          severity: HIGH,CRITICAL
          exit-code: "1"
