name: Admin desktop

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/admin/src-tauri/**"
      - "vendor/glib-0.18.5/**"
      - ".github/workflows/admin-desktop.yml"
  push:
    branches: [main]
    paths:
      - "apps/admin/src-tauri/**"
      - "vendor/glib-0.18.5/**"
      - ".github/workflows/admin-desktop.yml"

permissions:
  contents: read

concurrency:
  group: admin-desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux-build:
    name: Linux Tauri build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Verify patched GLib iterator
        run: cargo test --manifest-path vendor/glib-0.18.5/Cargo.toml --lib variant_iter::tests::test_variant_iter_array

      - name: Build Admin desktop application
        run: cargo build --manifest-path apps/admin/src-tauri/Cargo.toml --release --features custom-protocol --locked
