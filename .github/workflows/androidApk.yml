name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/androidApk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    # Skip the APK build entirely until it is wanted: nothing builds while
    # the ENABLE_APK_BUILD repository variable is unset. Set it to "true"
    # (Settings > Secrets and variables > Actions > Variables) to build again.
    if: ${{ vars.ENABLE_APK_BUILD == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_USE_MOCKS: "true"
      EXPO_PUBLIC_SELLER_WEB_URL: https://dashboard.zudomart.com
      EXPO_PUBLIC_ADS_MANAGER_URL: https://ads.zudomart.com
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile --filter @zudomart/mobile...

      - name: Type-check
        working-directory: apps/mobile
        run: npx tsc --noEmit -p .

      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK with the commit
        working-directory: apps/mobile/android/app/build/outputs/apk/release
        run: mv app-release.apk "zudomart-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: zudomart-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error
