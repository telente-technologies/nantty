name: Backend

on:
  pull_request:
    paths: ["services/**", "services/python/intelligence/**", "infra/local/**", "docs/architecture/microservicesPlan.json", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["services/**", "services/python/intelligence/**", "infra/local/**"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      typescript: ${{ steps.filter.outputs.typescript }}
      elixir: ${{ steps.filter.outputs.elixir }}
      python: ${{ steps.filter.outputs.python }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - "services/go/**"
              - "services/contracts/**"
              - "services/scripts/**"
              - "infra/local/**"
            typescript:
              - "services/typescript/**"
              - "packages/**"
              - "pnpm-lock.yaml"
            elixir:
              - "services/elixir/**"
            python:
              - "services/python/intelligence/**"
            migrations:
              - "services/go/modules/*/src/migrations/**"

  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash services/scripts/check-backend-file-lengths.sh
      - run: bash services/scripts/check-no-raw-sql-in-typescript.sh

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk space (the full Go workspace build, vet and test cache does not fit the default free space)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7.0.1
      - name: Test event contract checker
        run: node --test scripts/checkEventContracts.test.mjs
      - name: Validate event contracts
        run: node scripts/checkEventContracts.mjs
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/go/platform/go.mod
          cache-dependency-path: services/go/**/go.sum
      - name: Format check
        working-directory: services/go
        run: test -z "$(gofmt -l $(go list -m -f '{{.Dir}}'))"
      - name: Build, vet and unit tests with the race detector
        working-directory: services/go
        run: |
          packages=$(go list -m -f '{{.Dir}}/...')
          go build $packages
          go vet $packages
          go test -short -race $packages
      - name: govulncheck (per module; it needs a go.mod in the working directory)
        run: |
          status=0
          for dir in $(go list -m -f '{{.Dir}}'); do
            (cd "$dir" && go run golang.org/x/vuln/cmd/govulncheck@latest ./...) || status=1
          done
          exit $status
        working-directory: services/go

  integration:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: nantty
          POSTGRES_PASSWORD: nantty
          POSTGRES_DB: nantty
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U nantty" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["16379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4-management
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 10s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "15432"
      PGPASSWORD: nantty
      POSTGRES_USER: nantty
      POSTGRES_DB: nantty
    steps:
      - name: Free runner disk space (the full Go workspace build, vet and test cache does not fit the default free space)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/go/platform/go.mod
          cache-dependency-path: services/go/**/go.sum
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Verify RabbitMQ definitions match the topology source
        run: |
          node infra/local/rabbitmq/generateDefinitions.mjs
          git diff --exit-code -- infra/local/rabbitmq/definitions.json
      - name: Create databases, roles and schemas like the local stack
        run: bash infra/local/postgres/create-databases.sh
      - name: Import RabbitMQ topology
        run: |
          curl -fsS -u guest:guest -H "content-type: application/json" -X POST http://localhost:15672/api/definitions --data-binary @infra/local/rabbitmq/definitions.json
      - name: Go integration tests against real Postgres, Valkey and RabbitMQ
        working-directory: services/go
        env:
          REDIS_URL: redis://localhost:16379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/nantty
        run: bash ../scripts/test-go-workspace.sh
      - run: pnpm install --frozen-lockfile --filter @nantty/social... --filter "@nantty/chat-crypto..." --filter @nantty/notifications... --filter @nantty/media...
      - name: TypeScript service tests that use the database
        env:
          DATABASE_URL: postgres://nantty:nantty@localhost:15432/nantty_test
          VALKEY_URL: redis://localhost:16379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/nantty
        run: |
          pnpm --filter @nantty/social test
          pnpm --filter @nantty/notifications test
          pnpm --filter @nantty/media test

  atlas-lint:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: nantty
          POSTGRES_PASSWORD: nantty
          POSTGRES_DB: nantty
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U nantty" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "15432"
      PGUSER: nantty
      PGPASSWORD: nantty
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install the Atlas community build (migrate lint is Pro-only in the official build since v0.38)
        env:
          ATLAS_VERSION: v1.3.0
          ATLAS_SHA256: 10d7913e3dce43ab99b8d71534a4cbadaf11a16dc293adf3b91d10e83a0ac70b
        run: |
          curl -sSfL -o "$RUNNER_TEMP/atlas" "https://atlasbinaries.com/atlas/atlas-community-linux-amd64-${ATLAS_VERSION}"
          echo "${ATLAS_SHA256}  $RUNNER_TEMP/atlas" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/atlas"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Lint every module migration directory against a clean dev database
        run: |
          psql -d postgres -c "CREATE ROLE nantty_readers NOLOGIN"
          status=0
          for dir in services/go/modules/*/src/migrations; do
            [ -f "$dir/atlas.sum" ] || continue
            psql -d postgres -c "DROP DATABASE IF EXISTS atlas_dev" -c "CREATE DATABASE atlas_dev"
            psql -d atlas_dev -c "CREATE EXTENSION IF NOT EXISTS postgis"
            echo "::group::$dir"
            atlas migrate validate --dir "file://$dir?format=golang-migrate" || status=1
            atlas migrate lint --dir "file://$dir?format=golang-migrate" \
              --dev-url "postgres://nantty:nantty@localhost:15432/atlas_dev?sslmode=disable&search_path=public" \
              --git-base "origin/${{ github.base_ref || 'main' }}" || status=1
            echo "::endgroup::"
          done
          exit $status

  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ["@nantty/gateway", "@nantty/social", "@nantty/notifications", "@nantty/media", "@nantty/search", "@nantty/support"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: |
          if [ "${{ matrix.package }}" = "@nantty/social" ]; then
            pnpm install --frozen-lockfile --filter "${{ matrix.package }}..." --filter "@nantty/chat-crypto..."
          else
            pnpm install --frozen-lockfile --filter "${{ matrix.package }}..."
          fi
      - run: pnpm --filter "${{ matrix.package }}" run --if-present typecheck
      - run: pnpm --filter "${{ matrix.package }}" run --if-present test

  elixir:
    needs: changes
    if: needs.changes.outputs.elixir == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/elixir/realtime
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"
      - uses: actions/cache@v6
        with:
          path: |
            services/elixir/realtime/deps
            services/elixir/realtime/_build
          key: mix-${{ hashFiles('services/elixir/realtime/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
        env:
          MIX_ENV: test

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/python/intelligence
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: services/python/intelligence/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: |
          set -o pipefail
          uv run pytest --tb=short 2>&1 | tee /tmp/pytest.log || {
            python3 - <<'PY'
          import pathlib
          log = pathlib.Path("/tmp/pytest.log").read_text()
          emitted = False
          for line in log.splitlines():
              if line.startswith(("FAILED ", "E   ")) or (
                  line.startswith("ERROR ") and not line.startswith("ERROR    intelligence.")
              ):
                  print(f"::error::{line[:400]}")
                  emitted = True
          if not emitted:
              for line in log.splitlines()[-10:]:
                  print(f"::error::{line[:400]}")
          PY
            exit 1
          }

  images:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deployable: [goIdentity, goLive, goMoney, goCommerce, goAds, goTrust]
    steps:
      - uses: actions/checkout@v7.0.1
      - env:
          DEPLOYABLE: ${{ matrix.deployable }}
        run: docker build -f "services/go/deployables/$DEPLOYABLE/Dockerfile" -t "nantty/ci-${DEPLOYABLE,,}" services

  gateway:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @nantty/gateway...
      - run: pnpm --filter @nantty/gateway typecheck
      - run: pnpm --filter @nantty/gateway test

  realtime:
    needs: changes
    if: needs.changes.outputs.elixir == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash services/scripts/test-realtime-in-docker.sh
