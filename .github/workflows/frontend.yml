name: Frontend

on:
  pull_request:
    paths: ["apps/**", "packages/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", "stylelint.config.mjs", "scripts/checkNoMocksInBuild.mjs", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["apps/**", "packages/**", "pnpm-lock.yaml", "scripts/checkNoMocksInBuild.mjs"]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      web: ${{ steps.filter.outputs.web }}
      webapp: ${{ steps.filter.outputs.webapp }}
      seller: ${{ steps.filter.outputs.seller }}
      studio: ${{ steps.filter.outputs.studio }}
      admin: ${{ steps.filter.outputs.admin }}
      ads: ${{ steps.filter.outputs.ads }}
      developer: ${{ steps.filter.outputs.developer }}
      sandbox: ${{ steps.filter.outputs.sandbox }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:
              - "packages/**"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "stylelint.config.mjs"
              - "scripts/checkNoMocksInBuild.mjs"
            web: ["apps/web/**"]
            webapp: ["apps/webapp/**"]
            seller: ["apps/seller/**"]
            studio: ["apps/studio/**"]
            admin: ["apps/admin/**"]
            ads: ["apps/ads/**"]
            developer: ["apps/developer/**"]
            sandbox: ["apps/sandbox/**"]
            mobile: ["apps/mobile/**"]

  plan:
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - id: pick
        env:
          SHARED: ${{ needs.changes.outputs.shared }}
          WEB: ${{ needs.changes.outputs.web }}
          WEBAPP: ${{ needs.changes.outputs.webapp }}
          SELLER: ${{ needs.changes.outputs.seller }}
          STUDIO: ${{ needs.changes.outputs.studio }}
          ADMIN: ${{ needs.changes.outputs.admin }}
          ADS: ${{ needs.changes.outputs.ads }}
          DEVELOPER: ${{ needs.changes.outputs.developer }}
          SANDBOX: ${{ needs.changes.outputs.sandbox }}
        run: |
          apps=()
          for pair in web:$WEB webapp:$WEBAPP seller:$SELLER studio:$STUDIO admin:$ADMIN ads:$ADS developer:$DEVELOPER sandbox:$SANDBOX; do
            name=${pair%%:*}; changed=${pair##*:}
            if [ "$SHARED" = "true" ] || [ "$changed" = "true" ]; then apps+=("\"$name\""); fi
          done
          echo "apps=[$(IFS=,; echo "${apps[*]}")]" >> "$GITHUB_OUTPUT"

  web:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: apps/${{ matrix.app }}/.next/cache
          key: next-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile --filter "{./apps/${{ matrix.app }}}..."
      - name: Typecheck
        run: pnpm --filter "./apps/${{ matrix.app }}" exec tsc --noEmit
      - name: Lint
        run: pnpm --filter "./apps/${{ matrix.app }}" run --if-present lint
      - name: Styles
        run: pnpm exec stylelint "apps/${{ matrix.app }}/src/**/*.module.css" --allow-empty-input
      - name: Contract tests
        run: pnpm --filter "./apps/${{ matrix.app }}" run --if-present test:contracts
      - name: Next build
        if: matrix.app != 'developer' && matrix.app != 'sandbox'
        run: pnpm --filter "./apps/${{ matrix.app }}" run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Build developer portal
        if: matrix.app == 'developer'
        run: pnpm --filter ./apps/developer run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: https://developers.nantty.com
          NEXT_PUBLIC_DOCS_SITE_URL: https://docs.nantty.com
          NEXT_PUBLIC_SANDBOX_PORTAL_URL: https://sandbox.nantty.com
          NEXT_PUBLIC_NANTTY_WEB_URL: https://nantty.com
      - name: Build sandbox portal
        if: matrix.app == 'sandbox'
        run: pnpm --filter ./apps/sandbox run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: https://sandbox.nantty.com
          NEXT_PUBLIC_DEVELOPER_PORTAL_URL: https://developers.nantty.com
          NEXT_PUBLIC_NANTTY_WEB_URL: https://nantty.com
      - name: No mock code in the production build
        run: node scripts/checkNoMocksInBuild.mjs "${{ matrix.app }}" --require-build

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "{./apps/mobile}..."
      - run: pnpm --filter ./apps/mobile exec tsc --noEmit
      - run: pnpm --filter ./apps/mobile run --if-present lint
      - run: pnpm --filter ./apps/mobile test --ci
      - name: Only the demo EAS profile may use mocks, and the production bundle has no mock modules
        run: pnpm run check:no-mocks:mobile
