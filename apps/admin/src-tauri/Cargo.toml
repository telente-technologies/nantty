[package]
name = "nantty-admin-desktop"
version = "0.1.0"
description = "Private Nantty administration desktop client"
authors = ["Nantty"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
glib = { path = "../../../vendor/glib-0.18.5" }
