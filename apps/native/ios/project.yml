name: Nantty
options:
  bundleIdPrefix: com.nantty
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Nantty
    INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
    NANTTY_APP_GROUP: group.com.nantty.app
targets:
  Nantty:
    type: application
    platform: iOS
    sources:
      - path: Nantty
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nantty.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NanttyAPIBaseURL: https://api.nantty.com
        INFOPLIST_KEY_NanttyWebAppBaseURL: https://web.nantty.com
        CODE_SIGN_ENTITLEMENTS: Nantty/Nantty.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          INFOPLIST_KEY_NanttyAPIBaseURL: http://localhost:8080
        Release:
          INFOPLIST_KEY_NanttyAPIBaseURL: https://api.nantty.com
    info:
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.nantty.app
            CFBundleURLSchemes:
              - nantty
    dependencies:
      - target: NanttyWidget
        embed: true
  NanttyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: NanttyWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nantty.app.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nantty
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: NanttyWidget/NanttyWidget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  NanttyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Nantty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nantty.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Nantty:
    build:
      targets:
        Nantty: all
        NanttyWidget: all
    run:
      config: Debug
    archive:
      config: Release
  NanttyTests:
    build:
      targets:
        Nantty: all
        NanttyTests: [test]
    test:
      targets:
        - NanttyTests
