[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures, local-only example config and migration integrity sums"
paths = [
  '''(^|/)testdata/''',
  '''_test\.go$''',
  '''\.test\.ts$''',
  '''(^|/)tests/fixtures/''',
  '''(^|/)\.env\.example$''',
  '''^infra/local/''',
  '''(^|/)atlas\.sum$''',
]

[[allowlists]]
description = "Loopback-only sandbox values for the security regression stack; production startup refuses every one (services/go/platform/config/sandboxSecretDigests.go)"
paths = ['''^security/regression/sandboxSecrets\.env$''']

[[allowlists]]
description = "KDF info label, not a secret"
regexTarget = "match"
regexes = ['''"NanttyRatchetv1"''']

[[allowlists]]
description = "Default guest login of the throwaway RabbitMQ CI service container"
regexTarget = "match"
regexes = ['''-u guest:guest''']
