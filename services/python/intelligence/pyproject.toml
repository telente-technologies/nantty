[project]
name = "nantty-intelligence"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.1.0",
    "boto3>=1.43.108",
    "fastapi>=0.141.1",
    "hiredis>=3.4.2",
    "httptools>=0.8.0",
    "numpy>=2.5.3",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
    "uvloop>=0.22.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[project.scripts]
nantty-intelligence-serve = "src.server:run_intelligence_server"
nantty-intelligence-pipeline = "src.jobs.pipeline_cli_job:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "N", "S", "RUF", "PL", "ASYNC", "PT", "RET", "ARG"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0917", "S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PLR0915", "ARG001"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "sklearn.*", "scipy.*", "joblib.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
