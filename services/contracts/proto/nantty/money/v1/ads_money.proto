syntax = "proto3";

package nantty.money.v1;

import "google/protobuf/timestamp.proto";
import "nantty/common/v1/money.proto";

// Internal only (go-ads -> go-money). Never exposed through the gateway.
// Errors are gRPC statuses with a google.rpc.ErrorInfo reason:
//   INVALID_ARGUMENT     VALIDATION_FAILED
//   FAILED_PRECONDITION  INSUFFICIENT_FUNDS, CURRENCY_NOT_SUPPORTED, ACCOUNT_RESTRICTED
//   ALREADY_EXISTS       IDEMPOTENCY_KEY_REUSED (same key, different request)
// Retrying with the same idempotency_key and the same request returns the stored receipt with replayed = true.
service AdsMoneyService {
  // Moves the boost budget from the user's spendable wallet balance into the platform ad-revenue holding account.
  rpc DebitWalletForBoost(DebitWalletForBoostRequest) returns (DebitWalletForBoostResponse);
  // Reverses a debit (whole amount) when the boost could not be created after the money moved, or returns the unspent remainder of a cancelled boost.
  rpc RefundBoostRemainder(RefundBoostRemainderRequest) returns (RefundBoostRemainderResponse);
}

message DebitWalletForBoostRequest {
  string user_id = 1;
  // > 0, in the user's wallet currency.
  nantty.common.v1.Money amount = 2;
  // 8..128 chars [A-Za-z0-9_-], scoped to user_id. go-ads passes the client's Idempotency-Key of the boost request,
  // because the boost row does not exist yet when the debit happens.
  string idempotency_key = 3;
}

message DebitWalletForBoostResponse {
  string ledger_transaction_id = 1;
  // Spendable wallet balance after the debit.
  nantty.common.v1.Money balance_after = 2;
  google.protobuf.Timestamp debited_at = 3;
  bool replayed = 4;
}

message RefundBoostRemainderRequest {
  string user_id = 1;
  nantty.common.v1.Money amount = 2;
  // 8..128 chars [A-Za-z0-9_-], scoped to user_id. go-ads passes "refund-" + the debit idempotency key.
  string idempotency_key = 3;
  // Idempotency key of the debit being reversed; go-money rejects an amount above the amount debited under it.
  string debit_idempotency_key = 4;
}

message RefundBoostRemainderResponse {
  string ledger_transaction_id = 1;
  nantty.common.v1.Money balance_after = 2;
  bool replayed = 3;
}
