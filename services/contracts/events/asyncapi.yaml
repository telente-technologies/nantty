asyncapi: 3.0.0
info:
  title: Zudomart domain events
  version: 1.0.0
  description: >
    Durable domain events. Each owning service writes the event to its Postgres outbox in the same
    transaction as the business change; a relay publishes it with publisher confirms to the RabbitMQ
    topic exchange zudomart.events with routing key = event type (message_id = envelope id).
    Each consumer owns a durable quorum queue bound to the routing keys it needs, with retry queues
    and a dead-letter queue, and must be idempotent on the envelope id. RabbitMQ adopted (owner, 2026-10-03).
defaultContentType: application/json
servers:
  aws:
    host: zudomart-mq.eu-west-1.amazonaws.com:5671
    protocol: amqps
    description: Amazon MQ for RabbitMQ cluster deployment in private subnets, vhost zudomart
  local:
    host: localhost:5672
    protocol: amqp
    description: infra/local docker compose, vhost zudomart
channels:
  domainEvents:
    address: zudomart.events
    messages:
      followCreated:
        $ref: '#/components/messages/followCreated'
      followRequestCreated:
