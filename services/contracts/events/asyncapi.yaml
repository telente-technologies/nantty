asyncapi: 3.0.0
info:
  title: Zudomart domain events
  version: 1.0.0
  description: >
    Durable domain events. Each owning service writes the event to its Postgres outbox in the same
    transaction as the business change; a relay publishes it to the SNS topic zudomart-domain-events
    with the message attribute eventType. Consumers own an SQS queue subscribed with a filter policy
    on eventType and must be idempotent on the envelope id.
defaultContentType: application/json
servers:
  aws:
    host: sns.eu-west-1.amazonaws.com
    protocol: sns
  local:
    host: localhost:14566
    protocol: sns
channels:
  domainEvents:
    address: zudomart-domain-events
    messages:
      accountRegistered:
        $ref: '#/components/messages/accountRegistered'
