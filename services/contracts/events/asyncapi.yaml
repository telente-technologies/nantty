asyncapi: 3.0.0
info:
  title: Zudomart domain events
  version: 1.0.0
  description: >
    Durable domain events. Each owning service writes the event to its Postgres outbox in the same
    transaction as the business change; a relay publishes it to the SNS topic zudomart-domain-events
    with the message attribute eventType. Consumers own an SQS queue subscribed with a filter policy
    on eventType and must be idempotent on the envelope id.
defaultContentType: application/json
servers:
  aws:
    host: sns.eu-west-1.amazonaws.com
    protocol: sns
  local:
    host: localhost:14566
    protocol: sns
channels:
  domainEvents:
    address: zudomart-domain-events
    messages:
      accountRegistered:
        $ref: '#/components/messages/accountRegistered'
      accountLoggedIn:
        $ref: '#/components/messages/accountLoggedIn'
      sessionRefreshTokenReuseDetected:
        $ref: '#/components/messages/sessionRefreshTokenReuseDetected'
      accountPasswordChanged:
        $ref: '#/components/messages/accountPasswordChanged'
      sessionRevoked:
        $ref: '#/components/messages/sessionRevoked'
      accountDeactivated:
        $ref: '#/components/messages/accountDeactivated'
      profileUpdated:
        $ref: '#/components/messages/profileUpdated'
      profileVisibilityChanged:
        $ref: '#/components/messages/profileVisibilityChanged'
      usernameChanged:
        $ref: '#/components/messages/usernameChanged'
      usernameWithheld:
        $ref: '#/components/messages/usernameWithheld'
      businessProfileCreated:
        $ref: '#/components/messages/businessProfileCreated'
      creatorProfileCreated:
        $ref: '#/components/messages/creatorProfileCreated'
      privacySettingsChanged:
        $ref: '#/components/messages/privacySettingsChanged'
      consentGranted:
        $ref: '#/components/messages/consentGranted'
      consentWithdrawn:
        $ref: '#/components/messages/consentWithdrawn'
      policyVersionPublished:
        $ref: '#/components/messages/policyVersionPublished'
      dataExportRequested:
        $ref: '#/components/messages/dataExportRequested'
      dataExportCompleted:
        $ref: '#/components/messages/dataExportCompleted'
      accountDeletionRequested:
        $ref: '#/components/messages/accountDeletionRequested'
      accountDeletionCancelled:
        $ref: '#/components/messages/accountDeletionCancelled'
      accountDeletionExecuted:
        $ref: '#/components/messages/accountDeletionExecuted'
      retentionPolicyUpdated:
        $ref: '#/components/messages/retentionPolicyUpdated'
      exchangeRateUpdated:
        $ref: '#/components/messages/exchangeRateUpdated'
      staffInvited:
        $ref: '#/components/messages/staffInvited'
      platformSettingChanged:
        $ref: '#/components/messages/platformSettingChanged'
operations:
  publishAuthEvents:
    action: send
    channel:
      $ref: '#/channels/domainEvents'
    messages:
      - $ref: '#/channels/domainEvents/messages/accountRegistered'
      - $ref: '#/channels/domainEvents/messages/accountLoggedIn'
      - $ref: '#/channels/domainEvents/messages/sessionRefreshTokenReuseDetected'
      - $ref: '#/channels/domainEvents/messages/accountPasswordChanged'
      - $ref: '#/channels/domainEvents/messages/sessionRevoked'
      - $ref: '#/channels/domainEvents/messages/accountDeactivated'
  publishUsersEvents:
    action: send
    channel:
      $ref: '#/channels/domainEvents'
    messages:
      - $ref: '#/channels/domainEvents/messages/profileUpdated'
      - $ref: '#/channels/domainEvents/messages/profileVisibilityChanged'
      - $ref: '#/channels/domainEvents/messages/usernameChanged'
      - $ref: '#/channels/domainEvents/messages/usernameWithheld'
      - $ref: '#/channels/domainEvents/messages/businessProfileCreated'
      - $ref: '#/channels/domainEvents/messages/creatorProfileCreated'
      - $ref: '#/channels/domainEvents/messages/privacySettingsChanged'
      - $ref: '#/channels/domainEvents/messages/consentGranted'
      - $ref: '#/channels/domainEvents/messages/consentWithdrawn'
      - $ref: '#/channels/domainEvents/messages/policyVersionPublished'
      - $ref: '#/channels/domainEvents/messages/dataExportRequested'
      - $ref: '#/channels/domainEvents/messages/dataExportCompleted'
      - $ref: '#/channels/domainEvents/messages/accountDeletionRequested'
      - $ref: '#/channels/domainEvents/messages/accountDeletionCancelled'
      - $ref: '#/channels/domainEvents/messages/accountDeletionExecuted'
      - $ref: '#/channels/domainEvents/messages/retentionPolicyUpdated'
  publishCurrencyEvents:
    action: send
    channel:
      $ref: '#/channels/domainEvents'
    messages:
      - $ref: '#/channels/domainEvents/messages/exchangeRateUpdated'
  publishAdminEvents:
    action: send
    channel:
      $ref: '#/channels/domainEvents'
    messages:
      - $ref: '#/channels/domainEvents/messages/staffInvited'
      - $ref: '#/channels/domainEvents/messages/platformSettingChanged'
components:
  messages:
    accountRegistered:
      name: account.registered
      headers: { type: object, properties: { eventType: { const: account.registered } } }
      payload:
        allOf:
          - $ref: './schemas/envelope.v1.json'
          - properties: { data: { $ref: './schemas/account.registered.v1.json' } }
    accountLoggedIn:
      name: account.loggedIn
      headers: { type: object, properties: { eventType: { const: account.loggedIn } } }
      payload:
        allOf:
