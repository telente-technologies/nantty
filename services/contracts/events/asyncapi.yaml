      - $ref: '#/channels/domainEvents/messages/dataExportCompleted'
      - $ref: '#/channels/domainEvents/messages/accountDeletionRequested'
      - $ref: '#/channels/domainEvents/messages/accountDeletionCancelled'
      - $ref: '#/channels/domainEvents/messages/accountDeletionExecuted'
      - $ref: '#/channels/domainEvents/messages/retentionPolicyUpdated'
  publishCurrencyEvents:
    action: send
    channel:
      $ref: '#/channels/domainEvents'
    messages:
      - $ref: '#/channels/domainEvents/messages/exchangeRateUpdated'
  publishAdminEvents:
    action: send
    channel:
      $ref: '#/channels/domainEvents'
    messages:
      - $ref: '#/channels/domainEvents/messages/staffInvited'
      - $ref: '#/channels/domainEvents/messages/platformSettingChanged'
  publishLiveEvents:
    action: send
    channel:
      $ref: '#/channels/domainEvents'
    messages:
      - $ref: '#/channels/domainEvents/messages/liveStarted'
      - $ref: '#/channels/domainEvents/messages/liveEnded'
      - $ref: '#/channels/domainEvents/messages/liveTopSupporterSelected'
      - $ref: '#/channels/domainEvents/messages/liveViewerCountChanged'
      - $ref: '#/channels/domainEvents/messages/giftSent'
      - $ref: '#/channels/domainEvents/messages/goalProgressed'
      - $ref: '#/channels/domainEvents/messages/goalCompleted'
      - $ref: '#/channels/domainEvents/messages/leaderboardUpdated'
      - $ref: '#/channels/domainEvents/messages/guestInvited'
      - $ref: '#/channels/domainEvents/messages/stageUpdated'
      - $ref: '#/channels/domainEvents/messages/battleCreated'
      - $ref: '#/channels/domainEvents/messages/battleStarted'
      - $ref: '#/channels/domainEvents/messages/battleScoreUpdated'
      - $ref: '#/channels/domainEvents/messages/battleEnded'
      - $ref: '#/channels/domainEvents/messages/battleWinnerCelebrated'
      - $ref: '#/channels/domainEvents/messages/battleSettled'
      - $ref: '#/channels/domainEvents/messages/battleCancelled'
      - $ref: '#/channels/domainEvents/messages/guestJoined'
      - $ref: '#/channels/domainEvents/messages/guestLeft'
      - $ref: '#/channels/domainEvents/messages/guestRemoved'
      - $ref: '#/channels/domainEvents/messages/guestMuted'
      - $ref: '#/channels/domainEvents/messages/guestReconnecting'
